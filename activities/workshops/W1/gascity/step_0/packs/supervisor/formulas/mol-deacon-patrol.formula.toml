name = "mol-deacon-patrol"
description = "Deacon patrol: route labelled beads, check health, loop."

[[steps]]
id = "route-needs-plan"
description = "Dispatch needs-plan beads to planner"
prompt = """
Find all open unassigned beads with label needs-plan:
  bd list --label=needs-plan --status=open --json
For each, sling to the planner:
  gc sling "$RIG/planner" "Pick up bead <id>: <title>"
Log how many were dispatched.
"""

