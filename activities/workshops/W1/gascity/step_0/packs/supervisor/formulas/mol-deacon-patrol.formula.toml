[[steps]]
id = "health-check"
description = "Check factory agent status"
prompt = """
Run gc status and report:
- Which agents are running vs idle vs stopped
- Any agents in an error state
If an agent has in_progress beads but no active session, log a warning.
"""

[[steps]]
id = "loop"
description = "Pour next patrol iteration"
prompt = """
Patrol complete. If any beads were dispatched or health issues found, log a summary.
Pour next patrol iteration:
  bd mol pour mol-deacon-patrol
Then sleep — do not spin immediately.
"""
