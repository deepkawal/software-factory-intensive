# Fired Up Pizza — composite pack bundling the 6 factory agents taught
# by the curriculum. Each agent is its own pack so participants can adopt
# them incrementally during the workshop labs. This composite imports all
# six for running the full factory against the reference project.
#
# Role → shipped pack mapping:
#   Planner      → ../planner
#   Architect    → ../architect
#   Designer     → ../designer
#   Builder      → ../builder        (called "Coder" in the curriculum)
#   Reviewer     → ../reviewer
#   Release-Gate → ../release-gate   (called "Deployer" in the curriculum)
#
# Hosts `gc fired-up-pizza import-tickets` as a pack command used by lab
# L2 to seed beads from reference-project/fired-up-pizza/tickets.md.

[pack]
name = "fired-up-pizza"
schema = 2

[imports.planner]
source = "../planner"

[imports.architect]
source = "../architect"

[imports.designer]
source = "../designer"

[imports.builder]
source = "../builder"

[imports.reviewer]
source = "../reviewer"

[imports.release-gate]
source = "../release-gate"
