# actual-improver — Feedback-Loop agent for the Actual Software Factory.
#
# Harvests runtime signals (metrics, errors, user feedback) after a release
# and feeds them back into the factory as new beads for the right upstream
# agent — architect, planner, designer, validator, builder, or reviewer.
#
# Wakes on a cooldown schedule (daily) rather than a label condition,
# because the feedback loop needs to run periodically regardless of
# whether new `needs-improve` work exists. (See the plan — improver is
# the one "periodic" agent in the otherwise label-driven pipeline.)
#
# Persona anchor: sre + performance-engineer + developer-advocate from
# actual-factory/extensions/factory-vscode/shared/actual-agents/built-in-agents.ts

[pack]
name = "actual-improver"
schema = 2
