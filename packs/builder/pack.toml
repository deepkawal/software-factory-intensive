# actual-builder — Build-Code agent for the Actual Software Factory.
#
# Takes beads labelled `ready-to-build` and produces working code that
# satisfies their acceptance criteria and passes the validator's tests.
#
# Ships the vendored `actual` skill under agents/builder/overlay/.claude/skills/
# so the builder can consult the rig's CLAUDE.md/AGENTS.md before writing
# code. Skills live per-agent because Gas City 0.15.x only materializes
# overlay content into sessions — see workshop comment on
# https://github.com/gastownhall/gascity/issues/669.
#
# Persona anchor: backend-engineer + frontend-engineer (generalist voice)
# from actual-factory/extensions/factory-vscode/shared/actual-agents/built-in-agents.ts

[pack]
name = "actual-builder"
schema = 2
