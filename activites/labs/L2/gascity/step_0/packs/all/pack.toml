# L2-step-0 actual-factory — Composition pack for the L2 lab checkpoint.
#
# Imports only the two packs the lab exercises (architect, planner). The
# L2 lab is the "Architect + Planner handoff contract" exercise from the
# curriculum; other agents aren't needed until later labs.
#
# Hosts the `wake-downstream` pack command. See packs/all/README.md for
# the rationale (workshop:#785 — no PACK_DIR in agent session shells).

[pack]
name = "actual-factory"
schema = 2

[imports.architect]
source = "../architect"

[imports.planner]
source = "../planner"
