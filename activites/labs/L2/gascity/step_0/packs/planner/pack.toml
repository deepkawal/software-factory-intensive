# actual-planner — Plan / Work-Breakdown agent for the Actual Software Factory.
#
# Takes goal-shaped beads (labelled needs-plan) and produces a
# dependency-ordered graph of concrete task beads that the builder
# can consume.
#
# Ships two skills under the agent's overlay (.claude/skills/):
#   1. `actual`            — vendored from actual-software/actual-skill, so the
#                            planner can keep CLAUDE.md/AGENTS.md in the loop.
#   2. `tracker-to-beads`  — pack-local; probes for sibling tracker skills
#                            (jira, linear, github-issues, tracker-*) and
#                            materializes external issues as `bd` beads.
#
# Skills live under agents/planner/overlay/.claude/skills/ because Gas City
# 0.15.x only materializes overlay content into sessions — pack-root skills/
# is discovered but not staged (workshop comment on
# https://github.com/gastownhall/gascity/issues/669).
#
# Persona anchor: product-manager + program-manager from
# actual-factory/extensions/factory-vscode/shared/actual-agents/built-in-agents.ts

[pack]
name = "actual-planner"
schema = 2
