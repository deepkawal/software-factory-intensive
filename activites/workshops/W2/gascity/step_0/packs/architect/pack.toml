# actual-architect — Architect agent pack for the Actual Software Factory.
#
# One of eight "Agent Operation" packs under packs/ that map the operations
# described at https://www.actual.ai/softwarefactory onto self-contained
# Gas City custom agents.
#
# Ships the `actual` CLI companion skill (vendored from
# actual-software/actual-skill) under agents/architect/overlay/.claude/skills/
# so the architect has inline knowledge of actual adr-bot for driving
# ADR → CLAUDE.md/AGENTS.md synthesis.
#
# Skills are duplicated across agent overlays rather than shared from a
# pack-root skills/ directory because Gas City 0.15.x does not materialize
# pack-root or per-agent agents/<n>/skills/ directories into session
# workspaces — only overlay content flows through. See workshop comment on
# https://github.com/gastownhall/gascity/issues/669.
#
# Persona anchor: principal-engineer + solutions-architect from
# actual-factory/extensions/factory-vscode/shared/actual-agents/built-in-agents.ts

[pack]
name = "actual-architect"
schema = 2
